name: CI

# Pushes to main and pull requests only run the tests. The Linux packages,
# the Android APK, the Windows exe/installer and the iOS IPA are built for
# version tags (which publish a release), for pushes to the next branch
# (which replace the "next" pre-release, the test builds that
# next.nova.jevido.app links to) and for manual runs (Actions > CI > Run
# workflow), which keep them as artifacts. The next branch builds Nova (dev)
# (see build/dev-app.sh), which installs next to Nova.
on:
  push:
    branches: [main, next]
    tags: ["v*"]
    # The website deploys itself from Coolify. Path filters don't apply to
    # tag pushes, so releases always build.
    paths-ignore: ["website/**"]
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to next replaces the test build anyway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/next' }}

env:
  WAILS_VERSION: v3.0.0-beta.18
  BUN_VERSION: "1.4.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install GTK/WebKit headers
        run: |
          # No man page index (slow), and give up on a stuck mirror.
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Go vet
        run: go vet . ./internal/... ./services/...

      # Windows builds without cgo, so cross-checking it here is cheap and
      # catches Linux-only code before a release does.
      - name: Go vet (Windows)
        env:
          GOOS: windows
        run: go vet . ./internal/... ./services/...

      - name: Go tests
        run: go test ./internal/... ./services/...

  version:
    name: Version
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      stamp: ${{ steps.v.outputs.stamp }}
      code: ${{ steps.v.outputs.code }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            stamp="$version"
          elif [[ "$GITHUB_REF" == refs/heads/next ]]; then
            version="0.1.0-next.${GITHUB_RUN_NUMBER}"
            # Test builds never update themselves, to a release or otherwise.
            stamp="dev"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
            # Manual builds are stamped "dev" so they never replace
            # themselves with an older release.
            stamp="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          # Android and iOS need a monotonically increasing integer.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          # Windows file versions and iOS CFBundleShortVersionString only
          # take numbers: 0.3.0-rc.1 becomes 0.3.0.
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Make it Nova (dev)
        if: github.ref == 'refs/heads/next'
        run: sh build/dev-app.sh

      - name: Cache Wails and Task
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/task
          key: tools-${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Install build dependencies
        run: |
          # No man page index (slow), and give up on a stuck mirror.
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          # Compiling the wails3 CLI takes minutes; it is cached per version.
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
            go install github.com/go-task/task/v3/cmd/task@latest
          fi

      - name: Set package version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # pacman versions may not contain "-", so 0.1.0-dev.5 becomes 0.1.0.dev.5.
          sed -i "s/^version: .*/version: \"${VERSION//-/.}\"/" build/linux/nfpm/nfpm.yaml

      # The AppImage is built in its own job, at the same time.
      - name: Build and package
        env:
          STAMP: ${{ needs.version.outputs.stamp }}
        run: task linux:create:deb linux:create:rpm linux:create:aur VERSION="$STAMP" UPDATE_REPO="$GITHUB_REPOSITORY" BUILD="${GITHUB_SHA::7}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Version-less names so .../releases/latest/download/<name> links
          # (install.sh, README) always point at the newest release.
          # The tarball is what install.sh and the in-app updater use.
          tar -C bin -czf dist/nova-linux-amd64.tar.gz nova
          cp bin/nova.deb dist/nova-linux-amd64.deb
          cp bin/nova.rpm dist/nova-linux-x86_64.rpm
          cp bin/nova.pkg.tar.zst dist/nova-linux-x86_64.pkg.tar.zst
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Make it Nova (dev)
        if: github.ref == 'refs/heads/next'
        run: sh build/dev-app.sh

      - name: Cache Wails and Task
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/task
          key: tools-${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Install build dependencies
        run: |
          # No man page index (slow), and give up on a stuck mirror.
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libfuse2 file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-gl gstreamer1.0-libav
          # Compiling the wails3 CLI takes minutes; it is cached per version.
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
            go install github.com/go-task/task/v3/cmd/task@latest
          fi

      # wails3 generate appimage finds WebKit's helper programs by walking all
      # of /usr, where GitHub's runners keep tens of GB of SDKs; that took over
      # two minutes. Mount empty folders over the ones an AppImage never uses.
      - name: Hide unrelated SDKs
        run: |
          for d in /usr/local /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/share/kotlinc /usr/share/sbt /usr/share/az_* /usr/share/gradle* \
            /usr/lib/jvm /usr/lib/google-cloud-sdk /usr/lib/mono /usr/lib/firefox; do
            if [ -d "$d" ]; then sudo mount -t tmpfs none "$d" && echo "hid $d"; fi
          done

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          # linuxdeploy looks up the copyright file of each of the ~400 bundled
          # libraries with its own dpkg-query, which takes over a minute.
          # Releases keep them (the libraries' licences ask for it); test builds
          # of next do without.
          if [ "$GITHUB_REF" = refs/heads/next ]; then export DISABLE_COPYRIGHT_FILES_DEPLOYMENT=1; fi
          task linux:create:appimage VERSION="$STAMP" UPDATE_REPO="$GITHUB_REPOSITORY" BUILD="${GITHUB_SHA::7}"

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp bin/nova-x86_64.AppImage dist/nova-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make it Nova (dev)
        if: github.ref == 'refs/heads/next'
        run: sh build/dev-app.sh

      - name: Cache Wails and Task
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/task
          key: tools-${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Install Wails and Task
        run: |
          # The wails3 CLI links against GTK/WebKit even for Android builds.
          # No man page index (slow), and give up on a stuck mirror.
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          # Compiling the wails3 CLI takes minutes; it is cached per version.
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
            go install github.com/go-task/task/v3/cmd/task@latest
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (e.g. pull requests from forks) Gradle falls
          # back to the debug keystore, which is fine for a test build.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOVA_VERSION: ${{ needs.version.outputs.version }}
          NOVA_VERSION_CODE: ${{ needs.version.outputs.code }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: task android:package ARCH=arm64 VERSION="$STAMP" UPDATE_REPO="$GITHUB_REPOSITORY" BUILD="${GITHUB_SHA::7}"

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp bin/nova.apk dist/nova-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows exe and installer
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    # Wails builds Windows without cgo, so this cross-compiles on Linux;
    # makensis runs on Linux too.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Make it Nova (dev)
        if: github.ref == 'refs/heads/next'
        run: sh build/dev-app.sh

      - name: Cache Wails and Task
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/task
          key: tools-${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Install build dependencies
        run: |
          # The wails3 CLI links against GTK/WebKit even for Windows builds.
          # No man page index (slow), and give up on a stuck mirror.
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev nsis
          # Compiling the wails3 CLI takes minutes; it is cached per version.
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
            go install github.com/go-task/task/v3/cmd/task@latest
          fi

      - name: Set file version
        env:
          NUMERIC: ${{ needs.version.outputs.numeric }}
        run: sed -i "s/\"0\.1\.0\"/\"$NUMERIC\"/g" build/windows/info.json

      - name: Build exe and installer
        env:
          NUMERIC: ${{ needs.version.outputs.numeric }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          task package GOOS=windows ARCH=amd64 VERSION="$STAMP" \
            UPDATE_REPO="$GITHUB_REPOSITORY" BUILD="${GITHUB_SHA::7}" PRODUCT_VERSION="$NUMERIC"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # The portable exe is also what the in-app updater downloads.
          cp bin/nova.exe dist/nova-windows-amd64.exe
          cp bin/nova-amd64-installer.exe dist/nova-windows-amd64-setup.exe
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS IPA
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.event_name == 'workflow_dispatch'
    # The only macOS job: macOS minutes are expensive, keep it that way.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Each job builds with its own tags and flags, so each keeps its own Go
      # build cache; one shared cache only ever held the first job's builds.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Make it Nova (dev)
        if: github.ref == 'refs/heads/next'
        run: sh build/dev-app.sh

      - name: Cache Wails and Task
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/task
          key: tools-${{ runner.os }}-${{ runner.arch }}-wails-${{ env.WAILS_VERSION }}

      - name: Install Wails and Task
        run: |
          # Compiling the wails3 CLI takes minutes; it is cached per version.
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
            go install github.com/go-task/task/v3/cmd/task@latest
          fi

      - name: Set bundle version
        env:
          NUMERIC: ${{ needs.version.outputs.numeric }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          plutil -replace CFBundleShortVersionString -string "$NUMERIC" build/ios/Info.plist
          plutil -replace CFBundleVersion -string "$CODE" build/ios/Info.plist

      # Optional: with an Apple Developer certificate and provisioning
      # profile in these secrets the IPA is properly signed. Without them it
      # is ad-hoc signed, which sideloading tools (AltStore, SideStore,
      # Sideloadly) re-sign with the user's own Apple ID.
      - name: Signing identity
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "No signing secrets; building an ad-hoc signed IPA."
            echo "CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/nova.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/nova.mobileprovision"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk 'NR==1 {print $2}')"
          # A distribution build must carry exactly the profile's entitlements.
          security cms -D -i "$RUNNER_TEMP/nova.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/profile.plist"
          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "PROVISIONING_PROFILE=$RUNNER_TEMP/nova.mobileprovision"
            echo "ENTITLEMENTS_FILE=$RUNNER_TEMP/entitlements.plist"
          } >> "$GITHUB_ENV"

      - name: Build IPA
        env:
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          extra=()
          if [ -n "${PROVISIONING_PROFILE:-}" ]; then
            extra+=(PROVISIONING_PROFILE="$PROVISIONING_PROFILE" ENTITLEMENTS_FILE="$ENTITLEMENTS_FILE")
          fi
          task ios:package:ipa IOS_PLATFORM=device CODESIGN_IDENTITY="$CODESIGN_IDENTITY" \
            VERSION="$STAMP" UPDATE_REPO="$GITHUB_REPOSITORY" BUILD="${GITHUB_SHA::7}" "${extra[@]}"

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp bin/nova.ipa dist/nova-ios.ipa
          unzip -l dist/nova-ios.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, appimage, android, windows, ios, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "Nova ${TAG#v}")
          # The release's CHANGELOG.md section (the What's New dialog's text)
          # becomes the notes, without the icon names; else GitHub's own.
          awk -v v="${TAG#v}" '
            /^## / { on = ($2 == v || $2 == "v" v); next }
            on { sub(/^- \[[a-z0-9-]+\] /, "- "); print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          # v1.2.0-rc.1 style tags become pre-releases, which the updaters skip.
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  next:
    name: Next pre-release
    if: github.ref == 'refs/heads/next'
    needs: [test, linux, appimage, android, windows, ios, version]
    runs-on: ubuntu-24.04
    # One at a time, so two quick pushes don't race over the tag.
    concurrency: next-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Replace the next pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A pre-release is never "latest", so releases/latest links, the
          # site on main and the updaters keep pointing at the real release.
          gh release delete next --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create next dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nova next ($VERSION)" \
            --notes "Nova (dev): a test build of the next branch at ${GITHUB_SHA::7}. It installs next to Nova, with its own settings. It may be broken, and it doesn't update itself. Get it from https://next.nova.jevido.app."
