name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WAILS_VERSION: v3.0.0-beta.18
  BUN_VERSION: "1.4.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Go vet
        run: go vet . ./internal/... ./services/...

      - name: Go tests
        run: go test ./internal/... ./services/...

  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Android needs a monotonically increasing integer.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: [test, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libfuse2 file
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Set package version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # pacman versions may not contain "-", so 0.1.0-dev.5 becomes 0.1.0.dev.5.
          sed -i "s/^version: .*/version: \"${VERSION//-/.}\"/" build/linux/nfpm/nfpm.yaml

      - name: Build and package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: task package

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp bin/nova "dist/nova-${VERSION}-linux-amd64"
          cp bin/nova-x86_64.AppImage "dist/nova-${VERSION}-x86_64.AppImage"
          cp bin/nova.deb "dist/nova-${VERSION}-amd64.deb"
          cp bin/nova.rpm "dist/nova-${VERSION}-x86_64.rpm"
          cp bin/nova.pkg.tar.zst "dist/nova-${VERSION}-x86_64.pkg.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: [test, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Wails and Task
        run: |
          # The wails3 CLI links against GTK/WebKit even for Android builds.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (e.g. pull requests from forks) Gradle falls
          # back to the debug keystore, which is fine for a test build.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOVA_VERSION: ${{ needs.version.outputs.version }}
          NOVA_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: task android:package ARCH=arm64

      - name: Collect artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp bin/nova.apk "dist/nova-${VERSION}-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nova ${TAG}" \
            --generate-notes
